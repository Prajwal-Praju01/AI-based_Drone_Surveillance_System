<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Globe -->
  <defs>
    <radialGradient id="globeGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#ffd700;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#ff8c00;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="streakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#808080;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Speed lines (left side) -->
  <rect x="30" y="40" width="220" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="80" width="200" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="120" width="210" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="160" width="190" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="200" width="215" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="240" width="195" height="8" fill="url(#streakGradient)" rx="4"/>
  <rect x="30" y="280" width="205" height="8" fill="url(#streakGradient)" rx="4"/>
  
  <!-- Globe -->
  <circle cx="300" cy="240" r="180" fill="url(#globeGradient)"/>
  <circle cx="300" cy="240" r="180" fill="none" stroke="#1e90ff" stroke-width="4"/>
  
  <!-- Continents (simplified) -->
  <path d="M 200,180 Q 220,160 250,170 L 280,190 Q 290,200 270,220 L 250,230 Q 230,240 220,220 Z" fill="#1e90ff" opacity="0.7"/>
  <path d="M 320,150 Q 340,140 360,155 L 380,180 Q 390,200 370,210 L 340,215 Q 320,210 315,190 Z" fill="#1e90ff" opacity="0.7"/>
  <path d="M 260,260 Q 280,250 310,270 L 330,290 Q 340,310 320,325 L 290,330 Q 270,320 265,295 Z" fill="#1e90ff" opacity="0.7"/>
  
  <!-- Orbital path -->
  <ellipse cx="300" cy="240" rx="220" ry="100" fill="none" stroke="#ff4500" stroke-width="6" opacity="0.8" transform="rotate(-25 300 240)"/>
  
  <!-- Satellite/Rocket -->
  <path d="M 380,100 L 480,40 L 490,50 L 485,60 L 480,65 Q 475,70 470,72 L 390,120 Z" fill="#ff4500"/>
  <path d="M 480,40 L 490,50 L 495,45 Z" fill="#ff6347"/>
  
  <!-- Hindi Text "हिंदुस्तान" (Hindustan) in stylized form -->
  <text x="580" y="200" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#1e90ff" letter-spacing="5">हिंदुस्तान</text>
  
  <!-- HAL Text -->
  <text x="530" y="380" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#1e90ff" letter-spacing="10">HAL</text>
  
  <!-- Underlines -->
  <rect x="530" y="265" width="650" height="6" fill="#c0c0c0" rx="3"/>
  <rect x="530" y="400" width="650" height="8" fill="#c0c0c0" rx="4"/>
</svg>
