services:
  # Backend Service
  - type: web
    name: drone-surveillance-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5000
    healthCheckPath: /health
    autoDeploy: true
    
  # Frontend Service
  - type: web
    name: drone-surveillance-frontend
    runtime: node
    buildCommand: "cd drone-surveillance-frontend && npm install && npm run build"
    staticPublishPath: ./drone-surveillance-frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
